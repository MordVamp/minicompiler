[package]
name = "minicompiler"
version = "0.1.0"
edition = "2021"
default-run = "minicompiler"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"

[[bin]]
name = "minicompiler"
path = "src/main.rs"